        { label: "K9", note: "Kiểu K9" },

    let currentSize = 0;

    function openProduct() {

    }

    function changeImage(index) {
      currentImage = index;
      render();
    }

    function selectSize(index) {
      currentSize = index;
      render();
    }

    function render() {
      const app = document.getElementById("app");

      app.innerHTML = `
        <section class="hero">

          <div class="hero-card">
            <div class="hero-image-wrap" onclick="openProduct()">

              <img
                class="hero-image"
                src="${product.images[currentImage]}"
                alt="${product.title}"
              >

              <div class="overlay-top">
                <div class="brand">${product.brand}</div>
              </div>

              <div class="counter">
                ${currentImage + 1}/${product.images.length}
              </div>

            </div>
          </div>

          <div class="thumbs">
            ${product.images.map((img, index) => `
              <div
                class="thumb ${index === currentImage ? 'active' : ''}"
                onclick="changeImage(${index})"
              >
                <img
                  src="${img}"
                  alt="${product.title} - hình ${index + 1}"
                >
              </div>
            `).join("")}
          </div>

          <div class="overlay-bottom">

            <div class="eyebrow">
              PHỤ KIỆN TÓC NỮ
            </div>

            <div class="hero-title">
              ${product.title}
            </div>

            <div class="hero-sub">
              ${product.subtitle}
            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="price-row">

              <div class="price-main">

                <div class="sale-price">
                  ${product.price}
                </div>

                <div class="old-price">
                  ${product.oldPrice}
                </div>

              </div>

              <div class="discount">
                ${product.discount}
              </div>

            </div>

            <div class="product-name">
              ${product.title}
            </div>

            <div class="product-meta">

              <div class="rating">
                ⭐ ${product.shop.rating}
              </div>

              <div>
                ${product.shop.productReviews} đánh giá
              </div>

              <div>
                Đã bán ${product.shop.sold}
              </div>

            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Điểm nổi bật
            </div>

            <div class="feature-list">

              ${product.features.map(item => `
                <div class="feature">

                  <div class="feature-icon">
                    ${item.icon}
                  </div>

                  <div>

                    <h4>
                      ${item.title}
                    </h4>

                    <p>
                      ${item.text}
                    </p>

                  </div>

                </div>
              `).join("")}

            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Chọn kiểu
            </div>

            <div class="sizes">

              ${product.sizes.map((size, index) => `
                <button
                  class="size-btn ${index === currentSize ? 'active' : ''}"
                  onclick="selectSize(${index})"
                >
                  ${size.label}
                </button>
              `).join("")}

            </div>

            <div class="size-note">
              Kiểu đang chọn:
              <strong>${product.sizes[currentSize].label}</strong>
              — ${product.sizes[currentSize].note}
            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Thông tin sản phẩm
            </div>

            <div class="info-grid">

              <div class="info-item">
                <span>Danh mục</span>
                <strong>Phụ kiện tóc</strong>
              </div>

              <div class="info-item">
                <span>Giới tính</span>
                <strong>Nữ</strong>
              </div>

              <div class="info-item">
                <span>Tình trạng</span>
                <strong>Còn hàng</strong>
              </div>

              <div class="info-item">
                <span>Chu vi</span>
                <strong>Khoảng 14 cm</strong>
              </div>

              <div class="info-item">
                <span>Số kiểu</span>
                <strong>21 kiểu</strong>
              </div>

              <div class="info-item">
                <span>Gửi từ</span>
                <strong>Hà Nội</strong>
              </div>

            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Mô tả sản phẩm
            </div>

            <div class="desc">

              ${product.description.map(text => `
                <p>${text}</p>
              `).join("")}

            </div>

            <div class="notice">
              ${product.notice}
            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Thông tin cửa hàng
            </div>

            <div class="shop-header">

              <div class="shop-avatar">
                🛍️
              </div>

              <div>

                <div class="shop-name">
                  ${product.shop.name}
                </div>

                <div class="shop-status">
                  ● Đang hoạt động
                </div>

              </div>

            </div>


            <div class="shop-stats">

              <div>
                <strong>${product.shop.rating}</strong>
                <span>Đánh giá</span>
              </div>

              <div>
                <strong>${product.shop.responseRate}</strong>
                <span>Tỉ lệ phản hồi</span>
              </div>

              <div>
                <strong>${product.shop.followers}</strong>
                <span>Người theo dõi</span>
              </div>

              <div>
                <strong>${product.shop.products}</strong>
                <span>Sản phẩm</span>
              </div>

            </div>


            <div class="shop-extra">

              <p>
                <strong>Tham gia:</strong>
                ${product.shop.joined}
              </p>

              <p>
                <strong>Thời gian phản hồi:</strong>
                ${product.shop.responseTime}
              </p>

            </div>


            <button
              class="shop-button"
              onclick="openProduct()"
            >
              Xem shop
            </button>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Đánh giá sản phẩm
            </div>

            <div class="review-summary">

              <div class="review-score">
                <strong>${product.shop.rating}</strong>
                <span>/ 5</span>
              </div>

              <div class="review-stars">
                ★★★★★
              </div>

              <div class="review-count">
                ${product.shop.productReviews} đánh giá
              </div>

            </div>

          </div>

        </section>


        <section class="section">

          <div class="card">

            <div class="section-title">
              Danh mục
            </div>

            <div class="category-list">

              ${product.category.map((item, index) => `
                <span>
                  ${item}
                  ${index < product.category.length - 1 ? "›" : ""}
                </span>
              `).join("")}

            </div>

          </div>

        </section>


        <div class="sticky-bar">

          <button
            class="btn btn-outline"
            onclick="navigator.clipboard.writeText(product.link).then(()=>alert('Đã sao chép link'))"
          >
            Sao chép link
          </button>

          <button
            class="btn btn-primary"
            onclick="openProduct()"
          >
            Xem sản phẩm
          </button>

        </div>
      `;
    }

    render();
  </script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --card: #171a22;
      --card-2: #1d2230;
      --text: #ffffff;
      --muted: #b9bfd1;
      --line: rgba(255,255,255,0.08);
      --red: #ff3b5c;
      --red-2: #ff6b81;
      --blue: #4cc9ff;
      --chip: rgba(255,255,255,0.08);
      --shadow: 0 16px 40px rgba(0,0,0,0.35);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top,
          rgba(255,59,92,0.22),
          transparent 28%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(76,201,255,0.16),
          transparent 24%
        ),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #0f1117 0%,
          #131722 100%
        );
      position: relative;
      overflow-x: hidden;
      padding-bottom: 100px;
    }


    /* HERO */

    .hero {
      position: relative;
    }

    .hero-card {
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.05),
          rgba(255,255,255,0.02)
        );
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero-image-wrap {
      position: relative;
      aspect-ratio: 1 / 1.15;
      background: #111;
      cursor: pointer;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay-top {
      position: absolute;
      inset: 0 0 auto 0;
      padding: 18px 16px 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.48),
          transparent
        );
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 7px 12px;
      backdrop-filter: blur(8px);
    }

    .overlay-bottom {
      position: relative;
      padding: 18px 16px 16px;
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(0,0,0,0.72)
        );
      margin-top: -145px;
      z-index: 2;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 12px;
      color: #ffd3da;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .hero-title {
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero-sub {
      font-size: 14px;
      line-height: 1.5;
      color: #e8eaf3;
      max-width: 96%;
    }

    .counter {
      position: absolute;
      right: 12px;
      bottom: 14px;
      font-size: 12px;
      color: #fff;
      background: rgba(255,255,255,0.18);
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      z-index: 4;
    }


    /* THUMBNAILS */

    .thumbs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 0 0;
      scrollbar-width: none;
    }

    .thumbs::-webkit-scrollbar {
      display: none;
    }

    .thumb {
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #0e1016;
      cursor: pointer;
      transition: .2s ease;
    }

    .thumb.active {
      border-color: var(--red-2);
      box-shadow:
        0 0 0 3px rgba(255,107,129,0.15);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    /* SECTIONS */

    .section {
      padding: 16px 14px 0;
    }

    .card {
      background:
        linear-gradient(
          180deg,
          var(--card),
          var(--card-2)
        );
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow);
    }


    /* PRICE */

    .price-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .price-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sale-price {
      font-size: 29px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .old-price {
      font-size: 14px;
      color: var(--muted);
      text-decoration: line-through;
    }

    .discount {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-2)
        );
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .product-name {
      font-size: 18px;
      line-height: 1.45;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .product-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    .rating {
      color: #ffd86b;
      font-weight: 700;
    }


    /* FEATURES */

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .feature-list {
      display: grid;
      gap: 12px;
    }

    .feature {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
    }

    .feature-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          rgba(255,59,92,0.18),
          rgba(76,201,255,0.14)
        );
      font-size: 18px;
    }

    .feature h4 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .feature p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }


    /* VARIANTS */

    .sizes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .size-btn {
      min-width: 55px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .size-btn.active {
      background:
        linear-gradient(
          135deg,
          rgba(255,59,92,0.24),
          rgba(255,107,129,0.18)
        );
      border-color: rgba(255,107,129,0.5);
      box-shadow:
        0 0 0 3px rgba(255,107,129,0.12);
    }

    .size-note {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }


    /* PRODUCT INFO */

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
    }

    .info-item span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .info-item strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }


    /* DESCRIPTION */

    .desc {
      font-size: 14px;
      line-height: 1.7;
      color: #e7eaf5;
    }

    .desc p + p {
      margin-top: 12px;
    }

    .notice {
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }


    /* SHOP */

    .shop-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .shop-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          rgba(255,59,92,0.25),
          rgba(76,201,255,0.2)
        );
      font-size: 23px;
    }

    .shop-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .shop-status {
      font-size: 12px;
      color: #7cffae;
    }

    .shop-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .shop-stats > div {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }

    .shop-stats strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .shop-stats span {
      font-size: 12px;
      color: var(--muted);
    }

    .shop-extra {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .shop-button {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(255,107,129,0.4);
      border-radius: 15px;
      background: rgba(255,59,92,0.1);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }


    /* REVIEWS */

    .review-summary {
      text-align: center;
      padding: 8px 0;
    }

    .review-score {
      margin-bottom: 5px;
    }

    .review-score strong {
      font-size: 36px;
      font-weight: 800;
    }

    .review-score span {
      color: var(--muted);
      font-size: 14px;
    }

    .review-stars {
      color: #ffd86b;
      letter-spacing: 3px;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .review-count {
      color: var(--muted);
      font-size: 13px;
    }


    /* CATEGORY */

    .category-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .category-list span:last-child {
      color: #fff;
      font-weight: 700;
    }


    /* STICKY */

    .sticky-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 430px;
      padding: 12px 14px
        calc(12px + env(safe-area-inset-bottom));
      background: rgba(10,12,18,0.88);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .btn {
      height: 52px;
      border: none;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-outline {
      flex: 1;
      background: rgba(255,255,255,0.05);
      color: white;
      border: 1px solid var(--line);
    }

    .btn-primary {
      flex: 1.35;
      background:
        linear-gradient(
          135deg,
          var(--red),
          var(--red-2)
        );
      color: white;
      box-shadow:
        0 14px 30px rgba(255,59,92,0.28);
    }


    /* MOBILE */

    @media (max-width: 360px) {

      .hero-title {
        font-size: 19px;
      }

      .hero-sub {
        font-size: 13px;
      }

      .sale-price {
        font-size: 25px;
      }

      .product-name {
        font-size: 16px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</body>
</html>
